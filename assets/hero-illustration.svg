<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t">
  <title id="t">Illustration : un téléphone avec des bulles de conversation, des contacts connectés et des réactions emoji</title>
  <!-- Illustration de la page d'accueil (dessinée en SVG, aucune image externe) -->
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#e85aad"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0e8a9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f7dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6f7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#101828" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen"><rect x="212" y="70" width="176" height="370" rx="26"/></clipPath>
  </defs>

  <style>
    .float-a { animation: floatA 6s ease-in-out infinite; }
    .float-b { animation: floatB 7s ease-in-out infinite; }
    .float-c { animation: floatA 8s ease-in-out infinite 1s; }
    .dot { animation: blink 1.4s infinite; }
    .dot:nth-of-type(2) { animation-delay: 0.2s; }
    .dot:nth-of-type(3) { animation-delay: 0.4s; }
    @keyframes floatA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes floatB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Halo et formes décoratives en arrière-plan -->
  <circle cx="300" cy="260" r="250" fill="url(#glow)"/>
  <circle cx="300" cy="260" r="190" fill="none" stroke="#8250df" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="300" cy="260" r="240" fill="none" stroke="#4f7cff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="2 12"/>

  <!-- Lignes pointillées reliant les contacts au téléphone -->
  <g stroke="url(#gBlue)" stroke-width="2.5" stroke-dasharray="6 8" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M118 150 Q170 170 212 190"/>
    <path d="M500 118 Q450 150 388 170"/>
    <path d="M92 390 Q160 380 212 350"/>
  </g>

  <!-- ===== Téléphone ===== -->
  <g filter="url(#shadow)">
    <rect x="198" y="52" width="204" height="406" rx="38" fill="#1b1f2a"/>
    <rect x="212" y="70" width="176" height="370" rx="26" fill="#f5f7fb"/>
  </g>
  <rect x="268" y="60" width="64" height="8" rx="4" fill="#2c3240"/>

  <g clip-path="url(#screen)">
    <!-- En-tête de conversation -->
    <rect x="212" y="70" width="176" height="58" fill="url(#gBlue)"/>
    <circle cx="240" cy="100" r="14" fill="#ffffff" fill-opacity="0.9"/>
    <text x="240" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f7cff" text-anchor="middle">É</text>
    <circle cx="251" cy="111" r="4.5" fill="#34d399" stroke="#fff" stroke-width="2"/>
    <rect x="262" y="90" width="70" height="8" rx="4" fill="#ffffff"/>
    <rect x="262" y="104" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.65"/>

    <!-- Bulle reçue -->
    <rect x="224" y="142" width="112" height="38" rx="14" fill="#ffffff" stroke="#e3e8f0"/>
    <rect x="236" y="154" width="84" height="6" rx="3" fill="#cfd6e2"/>
    <rect x="236" y="166" width="56" height="6" rx="3" fill="#cfd6e2"/>

    <!-- Bulle envoyée -->
    <rect x="262" y="192" width="114" height="38" rx="14" fill="url(#gBlue)"/>
    <rect x="274" y="204" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="274" y="216" width="50" height="6" rx="3" fill="#ffffff" fill-opacity="0.7"/>
    <text x="370" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#bff3ff" text-anchor="end">✓✓</text>

    <!-- Image partagée -->
    <rect x="224" y="242" width="112" height="78" rx="14" fill="#ffffff" stroke="#e3e8f0"/>
    <rect x="230" y="248" width="100" height="66" rx="10" fill="#dbeafe"/>
    <circle cx="308" cy="266" r="8" fill="#fbbf24"/>
    <path d="M230 304 L258 276 L278 296 L292 284 L330 314 L230 314 Z" fill="url(#gGreen)"/>

    <!-- Réaction sous l'image -->
    <rect x="296" y="312" width="44" height="20" rx="10" fill="#ffffff" stroke="#e3e8f0"/>
    <text x="318" y="326" font-size="11" text-anchor="middle">❤️ 2</text>

    <!-- Bulle envoyée courte -->
    <rect x="290" y="344" width="86" height="30" rx="14" fill="url(#gBlue)"/>
    <rect x="302" y="356" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.9"/>

    <!-- « en train d'écrire » -->
    <rect x="224" y="386" width="54" height="26" rx="13" fill="#ffffff" stroke="#e3e8f0"/>
    <circle class="dot" cx="240" cy="399" r="3.5" fill="#8a94a6"/>
    <circle class="dot" cx="251" cy="399" r="3.5" fill="#8a94a6"/>
    <circle class="dot" cx="262" cy="399" r="3.5" fill="#8a94a6"/>

    <!-- Zone de saisie -->
    <rect x="212" y="420" width="176" height="20" fill="#ffffff"/>
  </g>

  <!-- ===== Carte contact en ligne (gauche) ===== -->
  <g class="float-a">
    <g filter="url(#shadow)">
      <rect x="22" y="112" width="170" height="70" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="60" cy="147" r="20" fill="url(#gPink)"/>
    <text x="60" y="153" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <circle cx="74" cy="161" r="6" fill="#2da44e" stroke="#fff" stroke-width="2.5"/>
    <text x="92" y="143" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1b1f24">Alice</text>
    <text x="92" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#2da44e">● en ligne</text>
  </g>

  <!-- ===== Notification (haut droite) ===== -->
  <g class="float-b">
    <g filter="url(#shadow)">
      <rect x="420" y="70" width="160" height="62" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="452" cy="101" r="18" fill="url(#gBlue)"/>
    <text x="452" y="107" font-size="17" text-anchor="middle">🔔</text>
    <circle cx="466" cy="86" r="9" fill="#e5534b" stroke="#fff" stroke-width="2"/>
    <text x="466" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="480" y="97" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1b1f24">Nouveau</text>
    <text x="480" y="114" font-family="system-ui, sans-serif" font-size="12" fill="#667085">message</text>
  </g>

  <!-- ===== Réactions emoji (droite) ===== -->
  <g class="float-c">
    <g filter="url(#shadow)">
      <rect x="418" y="268" width="164" height="50" rx="25" fill="#ffffff"/>
    </g>
    <text x="446" y="301" font-size="22" text-anchor="middle">👍</text>
    <text x="482" y="301" font-size="22" text-anchor="middle">❤️</text>
    <text x="518" y="301" font-size="22" text-anchor="middle">😂</text>
    <text x="554" y="301" font-size="22" text-anchor="middle">🎉</text>
  </g>

  <!-- ===== Groupe de contacts (bas gauche) ===== -->
  <g class="float-b">
    <g filter="url(#shadow)">
      <rect x="14" y="352" width="176" height="74" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="44" cy="389" r="15" fill="url(#gGreen)" stroke="#fff" stroke-width="3"/>
    <circle cx="64" cy="389" r="15" fill="url(#gBlue)" stroke="#fff" stroke-width="3"/>
    <circle cx="84" cy="389" r="15" fill="url(#gPink)" stroke="#fff" stroke-width="3"/>
    <text x="44" y="394" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text>
    <text x="64" y="394" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">L</text>
    <text x="84" y="394" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">S</text>
    <text x="108" y="385" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1b1f24"># Projet</text>
    <text x="108" y="402" font-family="system-ui, sans-serif" font-size="11" fill="#667085">5 membres</text>
  </g>

  <!-- ===== Avion en papier (envoi) ===== -->
  <g transform="translate(470 395)">
    <g class="float-a">
      <circle r="34" fill="url(#gBlue)" filter="url(#shadow)"/>
      <path d="M-15 -2 L16 -14 L6 16 L0 5 Z" fill="#ffffff"/>
      <path d="M0 5 L16 -14 L-3 3 Z" fill="#dbe3ff"/>
    </g>
  </g>

  <!-- Étincelles -->
  <g fill="#fbbf24">
    <path d="M400 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
    <path d="M160 470 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
  <g fill="#8250df" opacity="0.6">
    <circle cx="170" cy="60" r="5"/>
    <circle cx="560" cy="210" r="4"/>
    <circle cx="420" cy="480" r="6"/>
    <circle cx="36" cy="270" r="4"/>
  </g>
</svg>
